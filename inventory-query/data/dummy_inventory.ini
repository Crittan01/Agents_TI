# =============================================================================
# INVENTARIO DUMMY — AnsibleBot / Inventory Query
# Servidores ficticios para pruebas de consulta en lenguaje natural.
# NO son accesibles via SSH ni AWX.
#
# Convención de nombres:
#   XX  YYY  ZZZ  TT  NN
#   │    │    │    │   └─ número secuencial (01-99)
#   │    │    │    └───── tipo: APP=aplicacion, WAS=webas, LNF=linea fija, etc.
#   │    │    └────────── tecnologia: WLS=weblogic, JOM=joomla, P8=filenet, OHS=http
#   │    └─────────────── ubicacion: SG=Bogota, SR=Regional, DN=Digital, AR=Archivo
#   └──────────────────── ambiente: sufijo P=prod, L=lab, D=dllo
#
# Ambientes:
#   _PDN / _PROD  = Produccion
#   _LAB / _LABO  = Laboratorio
#   _DLLO / _DESA = Desarrollo
# =============================================================================


