---
# =============================================================================
# FIX_DISK — Libera espacio en disco
#
# Acciones en orden de seguridad:
#   1. Archivos viejos en _disk_path (configurable, default /tmp)
#   2. Logs rotados en /var/log (*.gz, *.1, *.2, *.3, *.old, *-YYYYMMDD)
#   3. Journal systemd (vacuum a 7 días)
#   4. Caché de paquetes DNF/YUM
#   5. Core dumps en /var/crash y archivos core.*
# =============================================================================

- name: "FIX_DISK | Espacio libre antes"
  ansible.builtin.shell: df -BM {{ _disk_path }} | awk 'NR==2{gsub("M","",$4); print $4}'
  register: _disk_before_mb
  changed_when: false

# ── 1. Archivos viejos en disk_clean_path ─────────────────────────────────────
- name: "FIX_DISK | Limpiar archivos en {{ _disk_path }} con más de {{ _disk_days }} días"
  ansible.builtin.shell: |
    COUNT=0; SIZE=0
    while IFS= read -r f; do
      s=$(du -m "$f" 2>/dev/null | cut -f1)
      SIZE=$(( SIZE + ${s:-0} ))
      rm -f "$f" 2>/dev/null && COUNT=$(( COUNT + 1 ))
    done < <(find {{ _disk_path }} -maxdepth 3 -type f -mtime +{{ _disk_days }} 2>/dev/null)
    echo "$COUNT $SIZE"
  register: _old_files
  changed_when: _old_files.stdout.split()[0] | int > 0

- name: "FIX_DISK | Registrar — archivos viejos en {{ _disk_path }}"
  ansible.builtin.set_fact:
    _actions: >-
      {{ _actions + ['DISK: eliminados ' + _old_files.stdout.split()[0] +
         ' archivo(s) con >' + _disk_days | string + ' días en ' + _disk_path +
         ' (' + _old_files.stdout.split()[1] + ' MB)'] }}
  when: _old_files.stdout.split()[0] | int > 0

# ── 2. Logs rotados en /var/log ───────────────────────────────────────────────
- name: "FIX_DISK | Eliminar logs rotados en /var/log"
  ansible.builtin.shell: |
    COUNT=0; SIZE=0
    while IFS= read -r f; do
      s=$(du -m "$f" 2>/dev/null | cut -f1)
      SIZE=$(( SIZE + ${s:-0} ))
      rm -f "$f" 2>/dev/null && COUNT=$(( COUNT + 1 ))
    done < <(find /var/log -maxdepth 4 -type f \
      \( -name "*.gz" -o -name "*.1" -o -name "*.2" -o -name "*.3" -o -name "*.4" \
         -o -name "*.old" -o -name "*-[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]" \) 2>/dev/null)
    echo "$COUNT $SIZE"
  register: _rotated_logs
  changed_when: _rotated_logs.stdout.split()[0] | int > 0

- name: "FIX_DISK | Registrar — logs rotados"
  ansible.builtin.set_fact:
    _actions: >-
      {{ _actions + ['DISK: eliminados ' + _rotated_logs.stdout.split()[0] +
         ' log(s) rotado(s) en /var/log (' + _rotated_logs.stdout.split()[1] + ' MB)'] }}
  when: _rotated_logs.stdout.split()[0] | int > 0

# ── 3. Journal systemd ────────────────────────────────────────────────────────
- name: "FIX_DISK | Vaciar journal (conservar últimos 7 días)"
  ansible.builtin.shell: |
    journalctl --vacuum-time=7d 2>&1 | grep -E "Deleted|Vacuuming" | tail -1
  register: _journal_vacuum
  changed_when: "'Deleted archived journal' in _journal_vacuum.stdout"
  failed_when: false

- name: "FIX_DISK | Registrar — journal vacuum"
  ansible.builtin.set_fact:
    _actions: "{{ _actions + ['DISK: journal compactado — ' + _journal_vacuum.stdout | trim] }}"
  when: _journal_vacuum.changed

# ── 4. Caché DNF/YUM ─────────────────────────────────────────────────────────
- name: "FIX_DISK | Limpiar caché de paquetes (dnf/yum)"
  ansible.builtin.shell: |
    if command -v dnf &>/dev/null; then
      BEFORE=$(df -BM / | awk 'NR==2{gsub("M","",$3); print $3}')
      dnf clean all -q 2>/dev/null
      AFTER=$(df -BM / | awk 'NR==2{gsub("M","",$3); print $3}')
      echo $(( BEFORE - AFTER ))
    elif command -v yum &>/dev/null; then
      yum clean all -q 2>/dev/null
      echo "0"
    else
      echo "-1"
    fi
  register: _pkg_cache
  changed_when: _pkg_cache.stdout | int > 0
  failed_when: false

- name: "FIX_DISK | Registrar — caché de paquetes"
  ansible.builtin.set_fact:
    _actions: "{{ _actions + ['DISK: caché DNF limpiado (' + _pkg_cache.stdout | trim + ' MB)'] }}"
  when: _pkg_cache.stdout | int > 0

# ── 5. Core dumps ─────────────────────────────────────────────────────────────
- name: "FIX_DISK | Eliminar core dumps"
  ansible.builtin.shell: |
    COUNT=0; SIZE=0
    while IFS= read -r f; do
      s=$(du -m "$f" 2>/dev/null | cut -f1)
      SIZE=$(( SIZE + ${s:-0} ))
      rm -f "$f" 2>/dev/null && COUNT=$(( COUNT + 1 ))
    done < <(find /var/crash /tmp /var/tmp /root /home \
      -maxdepth 3 -type f \( -name "core" -o -name "core.*" -o -name "*.core" \) 2>/dev/null)
    echo "$COUNT $SIZE"
  register: _core_dumps
  changed_when: _core_dumps.stdout.split()[0] | int > 0
  failed_when: false

- name: "FIX_DISK | Registrar — core dumps"
  ansible.builtin.set_fact:
    _actions: >-
      {{ _actions + ['DISK: eliminados ' + _core_dumps.stdout.split()[0] +
         ' core dump(s) (' + _core_dumps.stdout.split()[1] + ' MB)'] }}
  when: _core_dumps.stdout.split()[0] | int > 0

# ── Resumen ────────────────────────────────────────────────────────────────────
- name: "FIX_DISK | Espacio libre después"
  ansible.builtin.shell: df -BM {{ _disk_path }} | awk 'NR==2{gsub("M","",$4); print $4}'
  register: _disk_after_mb
  changed_when: false

- name: "FIX_DISK | Calcular MB liberados"
  ansible.builtin.set_fact:
    _disk_freed_mb: "{{ [(_disk_after_mb.stdout | int) - (_disk_before_mb.stdout | int), 0] | max }}"

- name: "FIX_DISK | Sin nada que limpiar (debug)"
  ansible.builtin.debug:
    msg: "DISK: no se encontró nada que limpiar en {{ inventory_hostname }}"
  when:
    - _old_files.stdout.split()[0] | int == 0
    - _rotated_logs.stdout.split()[0] | int == 0
    - not _journal_vacuum.changed
    - not _pkg_cache.changed
    - _core_dumps.stdout.split()[0] | int == 0
